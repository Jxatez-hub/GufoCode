name: GufoCode
options:
  bundleIdPrefix: com.gufocode
  deploymentTarget:
    iOS: "16.0"
targets:
  GufoCode:
    type: application
    platform: iOS
    sources:
      - GufoCode
    info:
      path: GufoCode/Info.plist
      properties:
        CFBundleDisplayName: GufoCode
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gufocode.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
